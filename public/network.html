<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debate Network — DebateOS</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.person{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:800}
.person h3{margin:0;font-size:16px}
.chat{display:grid;grid-template-columns:300px 1fr;height:70vh;min-height:460px;padding:0;overflow:hidden}
@media(max-width:760px){.chat{grid-template-columns:1fr;height:auto}.convList{max-height:220px}}
.convList{border-right:1px solid var(--line);overflow:auto}
.conv{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #eef2f8;padding:12px 14px;cursor:pointer}
.conv:hover,.conv.active{background:var(--mist)}
.thread{display:flex;flex-direction:column;min-height:0}
.threadHead{padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.msg{max-width:75%;padding:9px 12px;border-radius:14px;background:#eef2f8;white-space:pre-wrap;font-size:14px}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff}
.msg time{display:block;font-size:10px;opacity:.6;margin-top:3px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{min-height:44px;height:44px}
</style>
</head>
<body>
<main class="page">
  <div class="pageHead"><div><div class="eyebrow">Community</div><h1>Debate Network</h1>
    <p class="muted" style="margin:0">Connect with debaters, adjudicators, IAs, CAPs, tab directors and equity officers.</p></div></div>
  <div class="tabs">
    <button class="active" data-tab="people" type="button">People</button>
    <button data-tab="connections" type="button">Connections <span class="badge" id="reqBadge" hidden></span></button>
    <button data-tab="messages" type="button">Messages <span class="badge" id="msgBadge" hidden></span></button>
    <button data-tab="profile" type="button">My profile</button>
  </div>

  <section id="tab-people">
    <div class="card row" style="margin-bottom:16px">
      <input id="q" placeholder="Search by name, institution or country" style="flex:2;min-width:200px">
      <select id="role" style="flex:1;min-width:160px"><option value="">All roles</option></select>
    </div>
    <div id="people" class="grid g3"></div>
  </section>

  <section id="tab-connections" hidden><div id="connections" class="grid g2"></div></section>

  <section id="tab-messages" hidden>
    <div class="card chat">
      <div class="convList" id="convList"></div>
      <div class="thread">
        <div class="threadHead" id="threadHead"><span class="muted">Select a conversation or message someone from People.</span></div>
        <div class="msgs" id="msgs"></div>
        <form class="composer" id="composer" hidden><textarea id="body" placeholder="Write a message…" maxlength="4000"></textarea><button class="btn" type="submit">Send</button></form>
      </div>
    </div>
  </section>

  <section id="tab-profile" hidden>
    <form class="card" id="profileForm" style="max-width:640px">
      <div class="grid g2">
        <label class="field"><span>Name</span><input id="pName" required></label>
        <label class="field"><span>Circuit role</span><select id="pRole"></select></label>
        <label class="field"><span>Institution / club</span><input id="pInst"></label>
        <label class="field"><span>Country</span><input id="pCountry"></label>
      </div>
      <label class="field"><span>Bio — experience, tournaments judged, formats</span><textarea id="pBio" maxlength="1000"></textarea></label>
      <button class="btn" type="submit">Save profile</button>
    </form>
  </section>
</main>
<script type="module" src="assets/js/pages/network.js"></script>
</body>
</html>
