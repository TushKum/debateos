<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournaments — DebateOS</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.tcard{display:flex;flex-direction:column;gap:8px}
.tcard h3{margin:0;font-size:17px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.kv{font-size:13px}.kv b{color:var(--muted);font-weight:600;margin-right:4px}
.month{margin:28px 0 12px;font-size:22px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="page">
  <div class="pageHead">
    <div><div class="eyebrow">Tournaments</div><h1>Global debate calendar</h1>
      <p class="muted" style="margin:0">Live from the <a id="sheetLink" href="https://docs.google.com/spreadsheets/d/1R9s3MAh1H_7rJ9NQhO18p6o7bvekrIDTk27l7emXk6o/htmlview#gid=1155692171" target="_blank" rel="noopener">Official Global Debating Spreadsheet</a>. <span id="updated"></span></p></div>
    <div class="row"><a class="btn ghost" href="tab.html">Host on DebateOS</a></div>
  </div>

  <div class="tabs"><button class="active" data-view="sheet" type="button">Global spreadsheet</button><button data-view="hosted" type="button">Hosted on DebateOS</button><button data-view="embed" type="button">Original sheet view</button></div>

  <section id="view-sheet">
    <div class="card filters">
      <label class="field" style="margin:0"><span>Search</span><input id="q" placeholder="Name, timezone, fees, judge rule…"></label>
      <label class="field" style="margin:0"><span>Month</span><select id="month"><option value="">All months</option></select></label>
      <label class="field" style="margin:0"><span>Mode</span><select id="mode"><option value="">Any</option><option value="online">Online</option><option value="person">In person</option></select></label>
      <div class="small muted" id="count"></div>
    </div>
    <div id="list"><p class="empty">Loading tournaments…</p></div>
  </section>

  <section id="view-hosted" hidden><div id="hosted" class="grid g3"><p class="empty">Loading…</p></div></section>

  <section id="view-embed" hidden>
    <div class="card" style="padding:0;overflow:hidden">
      <iframe title="Official Global Debating Spreadsheet" src="https://docs.google.com/spreadsheets/d/1R9s3MAh1H_7rJ9NQhO18p6o7bvekrIDTk27l7emXk6o/htmlview?widget=true&amp;headers=false#gid=1155692171" style="width:100%;height:75vh;border:0"></iframe>
    </div>
    <p class="small muted">The original sheet keeps its colour legend (WUDC premier, regional, large tournaments, invitationals, round robins).</p>
  </section>
</main>
<script type="module" src="assets/js/pages/tournaments.js"></script>
</body>
</html>
